<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Calculator</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calculator {
            width: 380px;
            padding: 30px;
            border-radius: 20px;
            background: #1f2937;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { margin-bottom: 10px; }
        .status { min-height: 25px; margin: 15px 0; color: #60a5fa; }
        input {
            width: 90%;
            padding: 14px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
        }
        button {
            border: none;
            padding: 13px 20px;
            margin: 7px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .voice { background: #2563eb; color: white; }
        .calculate { background: #16a34a; color: white; }
        .clear { background: #dc2626; color: white; }
        button:hover { opacity: 0.85; }
        .answer {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            min-height: 35px;
        }
        .example {
            margin-top: 20px;
            font-size: 14px;
            color: #9ca3af;
            line-height: 1.7;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h1>VOICE CALCULATOR</h1>
    <div class="status" id="status">Ready</div>

    <input type="text" id="expression" placeholder="Example: 25 plus 10">

    <br>

    <button class="voice" onclick="voiceInput()">🎤 Speak</button>
    <button class="calculate" onclick="calculator()">Calculate</button>
    <button class="clear" onclick="clearCalculator()">Clear</button>

    <div class="answer" id="answer"></div>

    <div class="example">
        Try saying:<br>
        "25 plus 10"<br>
        "50 minus 20"<br>
        "5 multiply 6"<br>
        "100 divided by 4"<br>
        "2 power 5"
    </div>
</div>

<script>
console.log("HELLO everYONE");

function speak(text) {
    console.log("speaking:", text);
    const voice = new SpeechSynthesisUtterance(text);
    voice.rate = 1.0;
    voice.volume = 1.0;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(voice);
}

function add(a, b) { return a + b; }
function sub(a, b) { return a - b; }
function multiply(a, b) { return a * b; }
function divide(a, b) { return a / b; }
function sqrt(a) { return Math.sqrt(a); }
function cbrt(a) { return Math.cbrt(a); }
function power(a, b) { return a ** b; }

const operations = {
    "+": add,
    "-": sub,
    "*": multiply,
    "**": power,
    "/": divide
};

function voiceInput() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        document.getElementById("status").innerText =
            "Speech recognition is not supported.";
        speak("Speech recognition is not supported");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    document.getElementById("status").innerText = "Listening...";
    speak("Speak your calculation");

    recognition.start();

    recognition.onresult = function(event) {
        const text =
            event.results[0][0].transcript.toLowerCase();

        console.log("You said:", text);
        document.getElementById("expression").value = text;
        document.getElementById("status").innerText =
            "You said: " + text;

        calculator();
    };

    recognition.onerror = function(event) {
        console.log(event.error);
        document.getElementById("status").innerText =
            "Could not understand";
        speak("Could not understand");
    };

    recognition.onend = function() {
        console.log("Recording finished.");
    };
}

function calculator() {
    let text =
        document.getElementById("expression").value
        .toLowerCase()
        .trim();

    if (text === "") return;

    text = text.replace(/ plus /g, " + ");
    text = text.replace(/ add /g, " + ");
    text = text.replace(/ minus /g, " - ");
    text = text.replace(/ subtract /g, " - ");
    text = text.replace(/ multiply /g, " * ");
    text = text.replace(/ times /g, " * ");
    text = text.replace(/ x /g, " * ");
    text = text.replace(/ into /g, " * ");
    text = text.replace(/ divided by /g, " / ");
    text = text.replace(/ divide /g, " / ");
    text = text.replace(/ by /g, " / ");
    text = text.replace(/ power of /g, " ** ");
    text = text.replace(/ power /g, " ** ");

    console.log("Converted:", text);

    const match = text.match(
        /(-?\d+(?:\.\d+)?)\s*(\*\*|[+\-*/])\s*(-?\d+(?:\.\d+)?)/
    );

    if (!match) {
        const message =
            "Your operation is not valid. Please check once.";
        document.getElementById("answer").innerText = message;
        speak(message);
        return;
    }

    const n1 = parseFloat(match[1]);
    const operation = match[2];
    const n2 = parseFloat(match[3]);

    if (!(operation in operations)) {
        const message =
            "Your operation is not valid. Please check once.";
        document.getElementById("answer").innerText = message;
        speak(message);
        return;
    }

    if (operation === "/" && n2 === 0) {
        const message = "You cannot divide by zero.";
        document.getElementById("answer").innerText = message;
        speak(message);
        return;
    }

    const answer = operations[operation](n1, n2);

    console.log(
        n1 + " " + operation + " " + n2 + " = " + answer
    );

    document.getElementById("answer").innerText =
        n1 + " " + operation + " " + n2 + " = " + answer;

    speak("The answer is " + answer);

    document.getElementById("status").innerText =
        "Your operation is valid";
}

function clearCalculator() {
    document.getElementById("expression").value = "";
    document.getElementById("answer").innerText = "";
    document.getElementById("status").innerText = "Ready";
    window.speechSynthesis.cancel();
}
</script>

</body>
</html>
